<!doctype html><html lang="sv"><meta charset="utf-8"><title>Lanista Våg-bot</title>
<style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:0 20px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 16px}textarea{height:180px;font-family:monospace}button{padding:10px 16px}</style>
<h1>Lanista Våg-bot – bokmärkesgenerator</h1>
<label>Railway URL</label><input id="u" placeholder="https://din-vag-bot.up.railway.app">
<label>UPDATE_SECRET</label><input id="s" type="password">
<button onclick="make()">Skapa kod</button>
<h2>Bokmärkets URL</h2><textarea id="o" readonly></textarea>
<p><b>Obs:</b> Dela inte bokmärket/koden offentligt. Den innehåller UPDATE_SECRET, men inte Lanista-cookie, lösenord eller Discord-token.</p>
<script>
const T="javascript:(async()=>{try{const R=\"DIN_RAILWAY_URL\".replace(/\\/$/,\"\"),S=\"DITT_UPDATE_SECRET\";if(location.hostname!==\"beta.lanista.se\"){alert(\"Öppna beta.lanista.se och logga in först.\");return}const r=await fetch(\"/api/clans/4/members?paginate=false\",{credentials:\"include\"});if(!r.ok)throw new Error(\"Kunde inte hämta klanmedlemmar. Är du inloggad?\");const members=await r.json();const body=JSON.stringify({secret:S,members,updatedAt:new Date().toISOString()});await fetch(R+\"/update\",{method:\"POST\",mode:\"no-cors\",headers:{\"Content-Type\":\"text/plain;charset=UTF-8\"},body});alert(\"Våglistan skickades till Discord. Klanmedlemmar hämtade: \"+members.length)}catch(e){console.error(e);alert(\"Kunde inte uppdatera våglistan: \"+e.message)}})();";
function make(){
 const u=document.getElementById('u').value.trim().replace(/\/$/,'');
 const s=document.getElementById('s').value.trim();
 if(!u.startsWith('https://'))return alert('Railway-URL måste börja med https://');
 if(s.length<12)return alert('Använd en längre UPDATE_SECRET.');
 const x=T.replace('DIN_RAILWAY_URL',u).replace('DITT_UPDATE_SECRET',s);
 document.getElementById('o').value=x;navigator.clipboard?.writeText(x).catch(()=>{});
}
</script></html>
